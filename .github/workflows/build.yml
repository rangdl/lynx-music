# 构建 Lynx 双端 bundle + Web 宿主底座,产物上传为 artifact。
# 使用 build:web-host(而非 build):web 宿主页依赖给 web-core client.js 打
# nativeModulesMap accessor 补丁(scripts/patch-web-core.mjs),rspeedy build 不会做这一步。
#
# 触发:push 到 main/master 或手动。产物:main.lynx.bundle / main.web.bundle / web/ 宿主文件。

name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & unit tests
        run: npm run test

      - name: Build (bundles + web-core patch)
        run: npm run build:web-host

      - name: Verify web-core patch applied
        run: |
          # 补丁缺失会让宿主页的 NativeModules 全体静默消失,必须在此失败
          grep -q '#nativeModulesMap;#napiModulesMap' \
            node_modules/@lynx-js/web-core/dist/client_prod/static/js/client.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lynx-app
          path: |
            dist/
            web/
          if-no-files-found: error
